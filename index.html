    let appState = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem('velora_mvp_state_v2');
        if (saved) return JSON.parse(saved);
      } catch (e) {
        console.warn('Storage unavailable, using in-memory state');
      }
      return JSON.parse(JSON.stringify(INITIAL_DATA));
    }

    function saveState() {
      try {
        localStorage.setItem('velora_mvp_state_v2', JSON.stringify(appState));
      } catch (e) {
        // Ignore storage quota/private mode errors
      }
    }

    function resetDemoData() {
      appState = JSON.parse(JSON.stringify(INITIAL_DATA));
      appState.currentScreen = 'home';
      appState.role = 'customer';
      saveState();
      render();
      showToast('Demo data restored to defaults');
    }

    // =========================================================================
    // 3. NAVIGATION & SHELL RENDERING
    // =========================================================================
    function navigateTo(screen, pushHistory = true) {
      if (pushHistory && appState.currentScreen && appState.currentScreen !== screen) {
        appState.history.push(appState.currentScreen);
      }
      appState.currentScreen = screen;

      const customerScreens = ['home', 'search', 'salonProfile', 'servicesMenu', 'dateTime', 'bookingConfirm', 'myBookings', 'customerProfile'];
      const ownerScreens = ['salonRegister', 'salonDashboard', 'servicesManage', 'staffManage', 'bookingCalendar', 'businessSettings'];

      if (customerScreens.includes(screen)) appState.role = 'customer';
      else if (ownerScreens.includes(screen)) appState.role = 'owner';
      else if (screen === 'platformRevenue') appState.role = 'platform';
      else if (screen === 'welcome' || screen === 'auth') appState.role = 'onboarding';

      saveState();
      render();
      const container = document.getElementById('screen-container');
      if (container) container.scrollTop = 0;
    }

    function goBack() {
      if (appState.history.length > 0) {
        const prev = appState.history.pop();
        navigateTo(prev, false);
      } else {
        navigateTo(appState.role === 'owner' ? 'salonDashboard' : 'home', false);
      }
    }

    function switchRole(role) {
      appState.role = role;
      if (role === 'onboarding') navigateTo('welcome');
      else if (role === 'customer') navigateTo('home');
      else if (role === 'owner') navigateTo('salonDashboard');
      else if (role === 'platform') navigateTo('platformRevenue');
    }

    function setLanguage(lang) {
      appState.language = lang;
      saveState();
      render();
      showToast(lang === 'hr' ? 'Jezik promijenjen na Hrvatski' : 'Language switched to English');
    }

    function toggleViewportMode() {
      appState.viewportMode = appState.viewportMode === 'mobile' ? 'desktop' : 'mobile';
      saveState();
      render();
    }

    function handleLogoClick() {
      if (appState.role === 'owner') navigateTo('salonDashboard');
      else if (appState.role === 'platform') navigateTo('platformRevenue');
      else navigateTo('home');
    }

    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const text = document.getElementById('toast-message');
      text.textContent = msg;
      banner.classList.remove('opacity-0', 'translate-y-3');
      banner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', 'translate-y-3');
      }, 2800);
    }

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    function toggleSaveSalon(salonId) {
      const idx = appState.customer.savedSalonIds.indexOf(salonId);

        showToast('Removed from saved ateliers');

        appState.customer.savedSalonIds.push(salonId);
        showToast('Saved to your favorite ateliers');
      }
      saveState();
      render();
    }

    function renderSearchScreen() {
      const q = (appState.searchQuery || '').toLowerCase().trim();
      const results = appState.salons.filter(s => {
        const matchesQuery = !q ||
          s.name.toLowerCase().includes(q) ||
          s.city.toLowerCase().includes(q) ||
          s.categories.some(c => c.toLowerCase().includes(q)) ||
          s.services.some(srv => srv.name.toLowerCase().includes(q));
        const matchesPrice = appState.filterPriceTier === 'All' || s.priceTier === appState.filterPriceTier;
        const matchesRating = s.rating >= Number(appState.filterMinRating || 0);
        const matchesToday = !appState.filterAvailableToday || s.availableToday;
        return matchesQuery && matchesPrice && matchesRating && matchesToday;
      });

      return `
        <div class="p-5 space-y-4">
          <div>
            <h1 class="font-serif-editorial text-3xl font-semibold text-espresso">Search & Filters</h1>

          <input type="text" value="${appState.searchQuery}" oninput="appState.searchQuery=this.value; render();" placeholder="${t('searchPlaceholder')}" class="w-full px-4 py-3 rounded-2xl bg-white border border-sand text-sm text-espresso" />

          <div class="flex flex-wrap gap-2">
            ${['All', '€€', '€€€'].map(tier => `
              <button onclick="appState.filterPriceTier='${tier}'; render();" class="px-3 py-1.5 rounded-full text-xs font-semibold ${appState.filterPriceTier === tier ? 'bg-espresso text-ivory' : 'bg-beige text-espresso border border-sand'}">${tier === 'All' ? 'All Prices' : tier}</button>

            <button onclick="appState.filterMinRating = appState.filterMinRating === 4.9 ? 0 : 4.9; render();" class="px-3 py-1.5 rounded-full text-xs font-semibold ${appState.filterMinRating === 4.9 ? 'bg-espresso text-ivory' : 'bg-beige text-espresso border border-sand'}">★ 4.9+</button>

            <button onclick="appState.filterAvailableToday = !appState.filterAvailableToday; render();" class="px-3 py-1.5 rounded-full text-xs font-semibold ${appState.filterAvailableToday ? 'bg-espresso text-ivory' : 'bg-beige text-espresso border border-sand'}">Available Today</button>
          </div>

          <div class="text-xs text-taupe font-medium">${results.length} ${results.length === 1 ? 'salon' : 'salons'} found</div>

          <div class="space-y-4">
            ${results.length === 0 ? `
              <div class="bg-white rounded-2xl border border-sand p-6 text-center space-y-2">
                <p class="text-xs text-taupe">No matching salons found. Try clearing your filters.</p>
                <button onclick="appState.searchQuery=''; appState.filterPriceTier='All'; appState.filterMinRating=0; appState.filterAvailableToday=false; render();" class="px-4 py-2 rounded-full bg-espresso text-ivory text-xs font-semibold">Clear All</button>
              </div>
            ` : results.map(s => renderSalonCard(s)).join('')}

        </div>
      `;

            ${tab === 'staff' ? `

      ];

    function submitNewBooking() {
      const salon = getActiveSalon();
      const services = salon.services.filter(s => appState.selectedServiceIds.includes(s.id));
      const specialist = salon.staff.find(st => st.id === appState.bookingDraft.specialistId) || salon.staff[0];
      const totalPrice = services.reduce((sum, s) => sum + Number(s.price), 0);
      const totalDuration = services.reduce((sum, s) => sum + Number(s.duration), 0);
      const code = 'VLR-' + Math.floor(8600 + Math.random() * 1399);

      const newBooking = {
        id: code,
        salonId: salon.id,
        salonName: salon.name,
        clientName: appState.customer.name,
        clientPhone: appState.customer.phone,
        serviceNames: services.length ? services.map(s => s.name) : ['Signature Atelier Session'],
        specialistId: specialist ? specialist.id : 'stf-1',
        specialistName: specialist ? specialist.name : 'Lead Specialist',
        date: appState.bookingDraft.date,
        time: appState.bookingDraft.time,
        duration: totalDuration || 60,
        totalPrice: totalPrice || 65,
        status: 'Confirmed',
        notes: appState.bookingDraft.notes || ''
      };

      appState.bookings.unshift(newBooking);
      appState.bookingDraft.notes = '';
      saveState();
      navigateTo('myBookings');
      showToast(`Reservation ${code} confirmed at ${salon.name}`);
    }

                  <div>
                    <span class="text-[10px] font-mono text-taupe">${b.id}</span>
                    <h3 class="font-serif-editorial text-xl font-semibold text-espresso leading-tight">${b.salonName}</h3>

    function applyReschedule(bookingId) {
      const b = appState.bookings.find(item => item.id === bookingId);
      const d = document.getElementById('resched-date').value;
      const tm = document.getElementById('resched-time').value;
      if (b && d && tm) {
        b.date = d;
        b.time = tm;
        saveState();
        closeModal();
        render();
        showToast(`Updated ${b.id} to ${d} at ${tm}`);

        salon.subscriptionStatus = 'Trial Ended — Action Needed';

        salon.trialDaysRemaining = 28;

    function simulateMonthlyBillingRun() {
      const activeSalons = appState.salons.filter(s => !s.trialExpired);
      const totalEur = activeSalons.reduce((sum, s) => sum + Number(s.monthlyFeeEur || 39), 0);
      const totalKm = activeSalons.reduce((sum, s) => sum + Number(s.monthlyFeeKm || 76), 0);
      activeSalons.forEach(s => {
        appState.platformOwner.invoices.unshift({
          id: 'INV-2026-' + Math.floor(1200 + Math.random() * 799),
          salon: s.name,
          city: s.city,
          plan: s.planId.toUpperCase(),
          amountEur: s.monthlyFeeEur,
          amountKm: s.monthlyFeeKm,
          date: '2026-11-20',
          status: 'Paid to Owner'
        });
      });
      saveState();
      render();
      showToast(`Simulated +${totalEur} € (${totalKm} KM) monthly SaaS payout to your IBAN!`);
    }

    function render() {
      const shell = document.getElementById('app-shell');
      if (shell) {
        if (appState.viewportMode === 'desktop') {
          shell.classList.remove('max-w-[440px]');
          shell.classList.add('max-w-[960px]');
        } else {
          shell.classList.remove('max-w-[960px]');
          shell.classList.add('max-w-[440px]');
        }
      }

      const vpLabel = document.getElementById('viewport-label');
      if (vpLabel) {
        vpLabel.textContent = appState.viewportMode === 'mobile' ? 'Mobile Frame' : 'Wide View';
      }

      const langEnBtn = document.getElementById('lang-en');
      const langHrBtn = document.getElementById('lang-hr');
      if (langEnBtn && langHrBtn) {
        langEnBtn.className = `px-2 py-0.5 rounded-full text-[11px] font-semibold transition ${appState.language === 'en' ? 'bg-espresso text-ivory' : 'text-espresso'}`;
        langHrBtn.className = `px-2 py-0.5 rounded-full text-[11px] font-semibold transition ${appState.language === 'hr' ? 'bg-espresso text-ivory' : 'text-espresso'}`;
      }

      document.querySelectorAll('.role-pill').forEach(btn => {
        btn.classList.remove('bg-espresso', 'text-ivory', 'shadow-sm');
        btn.classList.add('text-espresso');
      });
      const activeRoleBtn = document.getElementById(`role-btn-${appState.role}`);
      if (activeRoleBtn) {
        activeRoleBtn.classList.remove('text-espresso');
        activeRoleBtn.classList.add('bg-espresso', 'text-ivory', 'shadow-sm');
      }

      const backBtn = document.getElementById('header-back-btn');
      if (backBtn) {
        const showBack = !['welcome', 'home', 'salonDashboard', 'platformRevenue'].includes(appState.currentScreen);
        backBtn.classList.toggle('hidden', !showBack);
      }

      const navSelect = document.getElementById('screen-navigator');
      if (navSelect && navSelect.value !== appState.currentScreen) {
        navSelect.value = appState.currentScreen;
      }

      const container = document.getElementById('screen-container');
      const screenMap = {
        welcome: renderWelcomeScreen,
        auth: renderAuthScreen,
        home: renderCustomerHomeScreen,
        search: renderSearchScreen,
        salonProfile: renderSalonProfileScreen,
        servicesMenu: renderServicesMenuScreen,
        dateTime: renderDateTimeScreen,
        bookingConfirm: renderBookingConfirmScreen,
        myBookings: renderMyBookingsScreen,
        customerProfile: renderCustomerProfileScreen,
        salonRegister: renderSalonRegisterScreen,
        salonDashboard: renderSalonDashboardScreen,
        servicesManage: renderServicesManageScreen,
        staffManage: renderStaffManageScreen,
        bookingCalendar: renderBookingCalendarScreen,
        businessSettings: renderBusinessSettingsScreen,
        platformRevenue: renderPlatformRevenueScreen
      };

      const renderer = screenMap[appState.currentScreen] || renderCustomerHomeScreen;
      container.innerHTML = `<div class="fade-in">${renderer()}</div>`;

      renderBottomNav();
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottom-nav');
      if (!nav) return;

      if (appState.role === 'owner') {
        const items = [
          { id: 'salonDashboard', label: t('navDashboard'), icon: '◈' },
          { id: 'bookingCalendar', label: t('navCalendar'), icon: '◷' },
          { id: 'servicesManage', label: t('navServices'), icon: '✦' },
          { id: 'staffManage', label: t('navStaff'), icon: '◉' },
          { id: 'businessSettings', label: t('navSettings'), icon: '⚙' }
        ];
        nav.innerHTML = items.map(item => {
          const active = appState.currentScreen === item.id;
          return `
            <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center py-1 px-2 rounded-xl transition ${active ? 'text-espresso font-bold' : 'text-taupe hover:text-espresso'}">
              <span class="text-base leading-none">${item.icon}</span>
              <span class="text-[10px] mt-1">${item.label}</span>
            </button>
          `;
        }).join('');
      } else if (appState.role === 'platform') {
        nav.innerHTML = `
          <button onclick="navigateTo('platformRevenue')" class="flex-1 py-2 rounded-xl bg-espresso text-champagne text-xs font-semibold">★ Direct Payouts & MRR</button>
          <button onclick="navigateTo('salonDashboard')" class="flex-1 py-2 rounded-xl bg-beige text-espresso text-xs font-semibold ml-2">Salon Portal →</button>
        `;
      } else {
        const items = [
          { id: 'home', label: t('navExplore'), icon: '✦' },
          { id: 'search', label: t('navSearch'), icon: '⌕' },
          { id: 'myBookings', label: t('navBookings'), icon: '◷' },
          { id: 'customerProfile', label: t('navProfile'), icon: '◯' }
        ];
        nav.innerHTML = items.map(item => {
          const active = appState.currentScreen === item.id;
          return `
            <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center py-1 px-3 rounded-xl transition ${active ? 'text-espresso font-bold' : 'text-taupe hover:text-espresso'}">
              <span class="text-base leading-none">${item.icon}</span>
              <span class="text-[10px] mt-1">${item.label}</span>
            </button>
          `;
        }).join('');
      }
    }

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
